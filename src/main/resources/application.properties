# === Local development config (H2 in-memory database) ===
# To use Supabase locally, run with: -Dspring.profiles.active=prod
spring.datasource.url=jdbc:h2:mem:performancedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Auto-create tables from JPA entities (local dev only)
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# H2 Console (visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server port
server.port=8080

